  function githubLanding(){return `<div class="github-public"><div class="gh-public-nav"><span class="gh-public-mark">${svgGithub}</span><span>Product ▾ &nbsp;&nbsp; Solutions ▾ &nbsp;&nbsp; Resources ▾ &nbsp;&nbsp; Open Source ▾ &nbsp;&nbsp; Enterprise ▾</span><span style="margin-left:auto"></span><button class="dark-text-link" data-action="github-login">Sign in</button><button class="gh-outline ${s.guide?'focus-target':''}" data-action="github-signup">Sign up</button></div><div class="gh-hero"><div class="eyebrow">GITHUB · CODE COLLABORATION</div><h2>Build and ship software on a single, collaborative platform</h2><p>Join the world's most widely adopted AI-powered developer platform.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="hero-light ${s.guide?'focus-target':''}" data-action="github-login">Sign in →</button><button class="hero-outline" data-action="github-signup">Sign up for GitHub</button></div><div class="gh-hero-notice">교육용 화면 · 실제 GitHub 웹사이트 아님</div></div></div>`}

    else if(s.repoScreen==='repo')b=`<div class="g-body"><div class="repo-breadcrumb"><span>${svgGithub}</span> ${esc(s.githubUser)} <span>/</span> <b>${esc(s.repoName)}</b> <span class="public-tag">${s.visibility==='public'?'Public':'Private'}</span></div><div class="g-nav-tabs"><span class="current">⌘ Code</span><span>◉ Issues</span><span>⇄ Pull requests</span><span>⚙ Settings</span></div><div class="repo-toolbar"><div class="g-muted"><b>main ▾</b> &nbsp;&nbsp; ${s.commitCount} commit${s.commitCount===1?'':'s'}</div><div class="repo-buttons"><button class="g-btn" data-action="repo-code-menu">▤ Code ▾</button><div class="dropdown-wrap"><button class="g-btn ${s.guide&&!s.commitCount?'focus-target':''}" data-action="repo-add-menu">Add file ▾</button>${s.githubMenu?`<div class="github-dropdown"><button data-action="new-file">＋ Create new file</button><button data-action="new-file">↑ Upload files (체험용)</button></div>`:''}</div></div></div><div class="g-list"><div class="g-file-row">${s.commitCount?'✓ &nbsp; '+esc(s.commitMessage):'Quick setup — get started with your new repository'}</div>${s.commitCount?`<div class="g-file-row">📄 <span class="filename">index.html</span><span style="margin-left:auto;color:#707b87">${esc(s.commitMessage)}</span><button class="g-btn small" data-action="edit-file">✎ Edit</button></div>`:`<div class="g-file-row empty">You can create a new file or upload an existing file.</div>`}</div>${s.commitCount?`<div class="callout">✓ 코드를 저장소에 커밋했습니다. 이제 Vercel에서 웹사이트를 배포해 보세요.</div><button class="primary" data-action="next-vercel">↗ vercel.com 열기 (가상 탭)</button>`:`<div class="callout">Add file ▾ → Create new file → index.html 입력 → 코드 붙여넣기 → Commit changes</div>`}</div>`;
    else if(s.repoScreen==='editor')b=`<div class="g-body"><div class="g-muted">${esc(s.githubUser)} / <strong>${esc(s.repoName)}</strong> / Creating a new file</div><div style="display:flex;gap:10px;align-items:center;margin-top:16px"><span style="font-size:14px">main /</span><input id="file-name" class="input" style="max-width:260px" value="${esc(s.fileName)}" aria-label="파일 이름"></div><div class="g-code-title"><span>⌘</span><strong style="font-size:12px">Edit new file</strong><button style="margin-left:auto" class="g-btn" data-action="paste-code">▣ 코드 붙여넣기</button></div><textarea id="code-editor" class="g-codeeditor code" spellcheck="false" placeholder="ChatGPT에서 복사한 HTML 코드를 이곳에 붙여넣으세요.">${esc(s.editorCode)}</textarea><div class="g-notice">파일 이름은 <b>index.html</b>입니다. Ctrl+V 또는 위 붙여넣기 버튼을 사용할 수 있습니다.</div><div class="repo-toolbar"><button class="g-btn" data-action="cancel-editor">Cancel changes</button><button class="g-btn green ${s.guide?'focus-target':''}" data-action="open-commit">Commit changes...</button></div></div>`;
    return `<div class="g-ui">${githubTop()}${b}</div>`}


  function vercelTop(){return `<div class="v-top"><div class="v-brand"><span class="v-triangle"></span> vercel <span style="color:#aaa;font-size:12px">/ &nbsp;${esc(s.githubUser)}'s projects</span></div><span class="v-muted">Overview &nbsp;&nbsp; Integrations &nbsp;&nbsp; Activity &nbsp;&nbsp; Settings &nbsp;&nbsp; ◯</span></div>`}

  function vercel(){
    if(s.vercelScreen==='landing')return vercelLanding();
    if(s.vercelScreen==='login')return vercelLogin();
    let b='';
    if(s.vercelScreen==='dashboard')b=`<div class="v-body"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div><h2 class="v-heading">Overview</h2><div class="v-muted">Your Projects · ${esc(s.githubUser)}</div></div><div class="dropdown-wrap"><button data-action="vercel-project-menu" class="v-btn white ${s.guide?'focus-target':''}">＋ Add New ▾</button>${s.vercelMenu?`<div class="github-dropdown vercel-dropdown"><button data-action="vercel-new">＋ Project</button><button data-action="provider-unsupported">◇ Domain</button></div>`:''}</div></div><div class="v-card" style="text-align:center;padding:55px 18px"><div style="font-size:29px;margin-bottom:10px">▲</div><h3>No projects yet</h3><p class="v-muted">Import your first project from a Git repository.</p><button data-action="vercel-new" class="v-btn white" style="margin-top:8px">Add New Project</button></div></div>`;
    else if(s.vercelScreen==='import')b=`<div class="v-body"><h2 class="v-heading">New Project</h2><p class="v-muted">Let's deploy something new.</p><div class="v-card"><h3 style="margin:0 0 15px">Import Git Repository</h3><div class="repo-filter"><div class="repo-filter-account">${svgGithub} ${esc(s.githubUser)} ▾</div><input id="repo-filter" class="v-input" placeholder="Search repositories..." value="${esc(s.repoFilter)}"></div>${(!s.repoFilter||s.repoName.toLowerCase().includes(s.repoFilter.toLowerCase()))?`<div class="v-repo"><div style="min-width:0;flex:1"><div style="font-weight:700;font-size:13px">${svgGithub} &nbsp;${esc(s.githubUser)}/${esc(s.repoName)}</div><div class="v-muted">main · index.html · ${s.commitCount} commit</div></div><button data-action="vercel-import" class="v-btn white ${s.guide?'focus-target':''}">Import</button></div>`:`<div style="padding:23px;color:#aaa;text-align:center">No repositories found</div>`}<div class="permission-note">Missing Git repository? <button class="email-link" data-action="reconnect-github">Configure GitHub App permissions →</button></div></div><div class="v-card"><h3>Clone Template</h3><p class="v-muted">Or start from one of Vercel's templates.</p><div class="template-strip"><span>▲ Next.js</span><span>▣ Vite</span><span>◈ Astro</span></div></div></div>`;
    else if(s.vercelScreen==='configure')b=`<div class="v-body"><button class="text-back" data-action="vercel-new">← New Project</button><h2 class="v-heading" style="margin-top:12px">Configure Project</h2><p class="v-muted">Deploy your repository <b>${esc(s.githubUser)}/${esc(s.repoName)}</b></p><div class="v-card"><div class="configure-card-header">${svgGithub}<span><b>${esc(s.githubUser)}/${esc(s.repoName)}</b><small>Connected to GitHub · main</small></span></div><label class="v-label">Project Name</label><input id="project-name" class="v-input" value="${esc(s.projectName)}"><label class="v-label">Framework Preset</label><select id="framework" class="v-select"><option ${s.framework==='Other'?'selected':''}>Other</option><option ${s.framework==='Next.js'?'selected':''}>Next.js</option><option ${s.framework==='Vite'?'selected':''}>Vite</option></select><label class="v-label">Root Directory</label><input class="v-input" value="./" disabled><details class="v-details"><summary>Build and Output Settings</summary><div style="padding:12px 0" class="v-muted">Build Command: Not required for a static HTML website.</div></details><details class="v-details"><summary>Environment Variables</summary><div style="padding:12px 0" class="v-muted">No environment variables required.</div></details><div style="border-top:1px solid #262626;margin-top:22px;padding-top:20px;display:flex;align-items:center;justify-content:space-between;gap:12px"><div class="v-muted">Static HTML → Framework Preset: Other</div><button data-action="deploy" class="v-btn white ${s.guide?'focus-target':''}">Deploy →</button></div></div></div>`;
    else if(s.vercelScreen==='deploying'){
      const logs=['Cloning github.com/'+s.githubUser+'/'+s.repoName,'Checking out main · index.html','Installing dependencies (skipped)','Building static assets','Ready'];
      b=`<div class="v-body"><h2 class="v-heading">Deploying ${esc(s.projectName)}</h2><p class="v-muted">Deployment progress · educational simulation</p><div class="v-card"><h3 style="margin:0 0 12px">Build Logs</h3><div class="v-logs code">${logs.slice(0,s.deployLogStep+1).map((l,i)=>`<div class="${i===s.deployLogStep&&s.deployLogStep<4?'run':'ok'}">${i===s.deployLogStep&&s.deployLogStep<4?'◌':'✓'} &nbsp;${esc(l)}</div>`).join('')}</div><div class="v-muted" style="margin-top:16px">● Building... Please do not close this simulated window.</div></div></div>`;
    }
    else if(s.vercelScreen==='success')b=`<div class="v-body"><div class="success-card"><div class="success-icon">✓</div><div class="success-title">Congratulations!</div><div style="color:#c1cfc7;font-size:13px">Your project has been deployed. (시뮬레이션)</div><p class="fakeurl">https://${esc(slug(s.projectName))}.vercel.app</p><button class="v-btn white" data-action="visit">Visit ↗</button><button class="v-btn" style="margin-left:8px" data-action="edit-again">GitHub에서 수정</button></div><div class="v-muted" style="text-align:center">위 주소는 교육용 가상 주소이며 실제로 발급되지 않았습니다.</div></div>`;
    return `<div class="v-ui">${vercelTop()}${b}</div>`}


  function result(){return `<div class="preview-outer"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><div style="font-size:10px;color:#198b65;font-weight:800;letter-spacing:1px">SIMULATED DEPLOYMENT COMPLETE</div><h2 style="margin:2px 0 0;font-size:24px">나의 첫 웹사이트 완성!</h2></div><button class="secondary small" data-action="edit-again">↻ 코드 수정하고 재배포</button></div><div class="callout">이 페이지는 Vercel에 실제 게시된 것이 아닌 <strong>시뮬레이터 내부 미리보기</strong>입니다. 아래 결과물은 GitHub에서 커밋한 코드로 렌더링했습니다.</div><div class="preview-frame"><div class="preview-head"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span style="margin-left:12px">https://${esc(slug(s.projectName))}.vercel.app (가상 주소)</span></div><iframe title="배포된 홈페이지 모의 미리보기" sandbox="" srcdoc="${esc(s.deployedCode)}"></iframe></div><div style="margin-top:15px;display:flex;flex-wrap:wrap;gap:10px"><button class="primary" data-action="restart">새로운 배포 실습 시작</button><button class="secondary" data-go="vercel">Vercel 화면으로 돌아가기</button></div></div>`}
  function detail(){
    if(s.modal==='oauth')return {title:'GitHub 로그인 연동 승인',desc:'팝업에서 Vercel이 GitHub 계정에 접근할 수 있도록 모의 승인하세요.',hint:'실제로는 GitHub 로그인 이후 Vercel에 계정 연결 권한을 허용하는 화면입니다.'};
    if(s.modal==='install')return {title:'GitHub 저장소 접근 범위 선택',desc:'Only select repositories를 선택하고 모의 설치를 마치세요.',hint:'실제 환경에서는 필요한 저장소만 허용하는 방법이 안전합니다.'};
    if(s.modal==='commit')return {title:'커밋 확인 팝업',desc:'커밋 메시지를 확인한 후 Commit changes 버튼을 누르세요.',hint:'GitHub는 변경 내용을 저장하기 전에 확인 창을 보여 줍니다.'};
    if(s.stage==='chat')return s.chatScreen==='response'?{title:'코드를 복사하고 GitHub로 이동',desc:'코드를 복사한 후 github.com으로 이동하세요. 다음 화면부터 로그인도 직접 연습합니다.',hint:'코드 복사 → GitHub로 이동 순서입니다.'}:{title:'ChatGPT에 홈페이지 요청하기',desc:'만들고 싶은 홈페이지를 입력한 뒤 전송하세요.',hint:'예: 우리 반을 소개하는 홈페이지를 만들어줘.'};
    if(s.stage==='github')return ({landing:{title:'GitHub 홈페이지 접속',desc:'오른쪽 상단의 Sign in을 찾아 클릭하세요.',hint:'Github에 코드를 저장하려면 계정이 필요합니다.'},login:{title:'GitHub 로그인',desc:'실제 비밀번호를 입력하지 말고 체험 계정으로 모의 로그인하세요.',hint:'실제 계정 정보는 입력하지 않습니다.'},signup:{title:'GitHub 계정 생성 과정',desc:'회원가입 절차를 확인하고 체험 계정으로 진행할 수 있습니다.',hint:'실제 회원가입은 이루어지지 않습니다.'},dashboard:{title:'새 저장소 만들기',desc:'New repository를 눌러 새 코드 저장 공간을 만드세요.',hint:'Repository는 소스 파일을 보관하는 공간입니다.'},'new-repo':{title:'새 저장소 생성',desc:'Repository name을 입력하고 Public을 선택한 후 생성하세요.',hint:'예: my-first-website'},repo:{title:s.commitCount?'Vercel로 이동':'Add file 메뉴 열기',desc:s.commitCount?'GitHub 저장을 마쳤습니다. 이제 Vercel 홈페이지로 이동하세요.':'Add file ▾을 클릭하고 Create new file을 선택하세요.',hint:'커밋은 파일의 변경 사항을 GitHub에 저장하는 작업입니다.'},editor:{title:'index.html 코드 붙여넣기',desc:'파일을 생성하고 ChatGPT 코드를 붙여넣은 뒤 Commit changes를 눌러 팝업을 여세요.',hint:'실제 키보드의 Ctrl+V 또는 코드 붙여넣기 버튼을 사용할 수 있습니다.'}})[s.repoScreen];
    if(s.stage==='vercel')return ({landing:{title:'Vercel 홈페이지 접속',desc:'Sign Up 또는 Log In을 눌러 로그인 화면으로 이동하세요.',hint:'Vercel은 GitHub에 저장한 코드를 공개 웹사이트로 배포하는 서비스입니다.'},login:{title:'Vercel 로그인',desc:'Continue with GitHub를 눌러 GitHub 계정과 연동하는 과정을 연습하세요.',hint:'Vercel은 GitHub 계정을 로그인 수단으로 사용할 수 있습니다.'},dashboard:{title:'새 프로젝트 만들기',desc:'Add New → Project를 선택하세요.',hint:'처음 만든 GitHub 저장소를 Vercel 프로젝트에 연결합니다.'},import:{title:'GitHub 저장소 가져오기',desc:'앞에서 생성한 저장소를 찾아 Import를 누르세요.',hint:'실제 Vercel에서는 GitHub App에 해당 저장소 접근 권한이 필요합니다.'},configure:{title:'프로젝트 배포 설정',desc:'Framework Preset을 Other로 선택하고 Deploy를 누르세요.',hint:'index.html 하나만 있으면 별도의 빌드 명령이 필요 없습니다.'},deploying:{title:'배포 로그 확인',desc:'파일을 가져와 웹사이트를 생성하는 가상 배포 과정을 확인하세요.',hint:'로그는 교육용으로 재구성한 내용입니다.'},success:{title:'배포 완료',desc:'Visit 버튼을 눌러 완성한 홈페이지를 확인하세요.',hint:'표시되는 주소는 학습용 가상 주소입니다.'}})[s.vercelScreen];
    return {title:'전체 과정 완료',desc:'프롬프트 작성, 로그인, 권한 연결, GitHub 저장과 Vercel 배포를 모두 체험했습니다.',hint:'다시 시작하면 다른 주제의 홈페이지로 연습할 수 있습니다.'};
  }

  function progress(){let n=0;if(s.code)n+=15;if(s.githubLoggedIn)n+=12;if(s.repoCreated)n+=13;if(s.commitCount)n+=20;if(s.vercelLoggedIn)n+=12;if(s.githubAppInstalled)n+=8;if(s.deployed)n+=15;if(s.stage==='result')n+=5;return n}

  function aside(){const d=detail()||{title:'다음 단계',desc:'화면에서 안내된 버튼을 찾아보세요.',hint:'화면의 버튼을 눌러 계속 진행할 수 있습니다.'};return `<aside class="sidebar"><section class="panel"><div class="overline">YOUR PROGRESS</div><div class="panel-row" style="margin-top:8px"><strong style="font-size:17px">배포까지 ${progress()}%</strong><span class="textmuted">${stageIndex()+1} / 4 단계</span></div><div class="progress-track"><div class="progress-fill" style="width:${progress()}%"></div></div>${[['ChatGPT 코드 생성',!!s.code],['GitHub 모의 로그인',s.githubLoggedIn],['GitHub 저장소 생성',s.repoCreated],['코드 커밋',s.commitCount>0],['Vercel 모의 로그인',s.vercelLoggedIn],['GitHub 앱 연결 승인',s.githubAppInstalled],['모의 배포',s.deployed]].map(([name,done],i)=>`<div class="mini-check ${done?'complete':''}"><b>${done?'✓':i+1}</b> ${name}</div>`).join('')}</section><section class="panel"><div class="overline">CURRENT MISSION</div><h3>${esc(d.title)}</h3><p>${esc(d.desc)}</p><div class="toggle-row"><button class="${s.guide?'selected':''}" data-action="guide-on">안내 모드</button><button class="${!s.guide?'selected':''}" data-action="guide-off">도전 모드</button></div>${s.guide?`<div class="hint-box">💡 ${esc(d.hint)}</div>`:`<button class="hint-btn" data-action="hint-toggle">${s.hint?'힌트 접기':'힌트 보기'}</button>${s.hint?`<div class="hint-box">${esc(d.hint)}</div>`:''}`}</section><section class="panel"><div class="overline">SIMULATION DATA</div><p>실습 계정: <strong>${esc(s.githubUser)}</strong></p><p>저장소: <strong>${esc(s.repoName||'생성 전')}</strong></p><p>커밋: <strong>${s.commitCount}회</strong></p><p>배포: <strong>${s.deployed?'완료':'미완료'}</strong></p><hr class="g-hr"><div class="legal">⚑ 실제 인증 정보는 사용하지 않습니다. 본 서비스는 ChatGPT, GitHub, Vercel의 비공식 교육용 시뮬레이터입니다.</div></section></aside>`}

  function render(){persist();const root=$('#app');root.innerHTML=`<header class="app-header"><div class="brand"><div class="brand-emblem">↗</div><div><div class="brand-title">배포 연습실 <span style="font-size:12px;color:#99aece;font-weight:400">SHIPLAB</span></div><div class="brand-sub">ChatGPT → GitHub → Vercel 실습 시뮬레이터</div></div></div><div class="header-right"><span class="chip">● &nbsp;가상 실습 환경</span><button class="reset" data-action="restart">↺ 처음부터</button></div></header><main class="shell"><div class="intro"><div><h1>웹앱 배포, 직접 해보며 배우기</h1><p>실제 서비스와 유사한 화면에서 입력 · 저장 · 배포를 체험해 보세요.</p></div><nav class="stepper" aria-label="실습 단계">${steps()}</nav></div><div class="workspace">${browser()}${aside()}</div></main>`;bindText();if(s.stage==='vercel'&&s.vercelScreen==='deploying'&&!deployTimer)startDeploy()}
  function bindText(){
    const bindings=[['prompt-input','prompt'],['github-user','githubUser'],['repo-name','repoName'],['file-name','fileName'],['code-editor','editorCode'],['commit-message','commitMessage'],['project-name','projectName'],['repo-filter','repoFilter']];
    bindings.forEach(([id,key])=>{const el=$('#'+id);if(el)el.addEventListener('input',()=>{s[key]=el.value;persist();if(id==='repo-filter'){const at=el.selectionStart;render();const n=$('#repo-filter');if(n){n.focus();n.setSelectionRange(at,at)}}})});
    const f=$('#prompt-form');if(f)f.addEventListener('submit',e=>{e.preventDefault();if(!s.prompt.trim()){notify('만들고 싶은 홈페이지를 먼저 설명하세요.');return;}s.kind=determineKind(s.prompt);s.code=template(s.kind,s.prompt);s.chatScreen='response';render();notify('홈페이지 코드가 생성되었습니다.')});
    document.querySelectorAll('input[name="visibility"]').forEach(el=>el.addEventListener('change',()=>{s.visibility=el.value;persist()}));
    document.querySelectorAll('input[name="auth-scope"]').forEach(el=>el.addEventListener('change',()=>{s.authScope=el.value;render()}));
    const sel=$('#framework');if(sel)sel.addEventListener('change',()=>{s.framework=sel.value;persist()});
    const edt=$('#code-editor');if(edt)edt.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();const st=edt.selectionStart;edt.value=edt.value.slice(0,st)+'  '+edt.value.slice(edt.selectionEnd);edt.selectionStart=edt.selectionEnd=st+2;s.editorCode=edt.value;persist()}});
  }

  function showPreview(code){const blob=new Blob([code],{type:'text/html'});const url=URL.createObjectURL(blob);const w=window.open('about:blank','_blank');if(!w){notify('팝업 차단을 해제하거나 브라우저 설정을 확인해주세요.');URL.revokeObjectURL(url);return;}w.document.write(`<html lang="ko"><meta charset="utf-8"><title>모의 홈페이지 미리보기</title><style>body{margin:0;font-family:Arial,sans-serif}header{background:#151b25;color:#fff;padding:10px 15px;font-size:12px}iframe{width:100%;height:calc(100vh - 38px);border:0}</style><header>모의 홈페이지 미리보기 · 실제 배포 아님</header><iframe id="sample" sandbox=""></iframe></html>`);w.document.close();w.document.getElementById('sample').srcdoc=code;setTimeout(()=>URL.revokeObjectURL(url),1000)}
  function handle(action){switch(action){
    case 'copy-code':s.clip=s.code;persist();if(navigator.clipboard?.writeText)navigator.clipboard.writeText(s.code).catch(()=>{});notify('코드 복사 완료! GitHub에서 파일을 만들어 붙여넣으세요.');break;
    case 'show-code-preview':showPreview(s.code);break;
    case 'next-github':if(!s.code){notify('ChatGPT에서 코드를 먼저 생성하세요.');return;}s.stage='github';s.repoScreen=s.githubLoggedIn?'dashboard':'landing';render();break;
    case 'github-login':s.repoScreen='login';render();break;
    case 'github-signup':s.repoScreen='signup';render();break;
    case 'github-signup-complete':s.githubUser='demo-student';s.githubLoggedIn=true;s.repoScreen='dashboard';render();notify('모의 계정이 준비되었습니다.');break;
    case 'github-signin':if(!/^[a-zA-Z0-9-]{2,35}$/.test(s.githubUser)){notify('체험용 사용자 이름을 영문 2~35자로 입력하세요.');return;}s.githubLoggedIn=true;s.repoScreen='dashboard';render();notify('GitHub 모의 로그인 완료');break;
    case 'github-new':if(!s.githubLoggedIn){s.repoScreen='login';render();return;}s.repoScreen='new-repo';render();break;
    case 'create-repo':if(!s.githubLoggedIn){notify('먼저 로그인해야 합니다.');return;}if(!/^[a-zA-Z0-9][a-zA-Z0-9._-]{1,79}$/.test(s.repoName)){notify('저장소 이름을 2~80자 영문·숫자·하이픈으로 입력하세요.');return;}s.repoCreated=true;s.repoScreen='repo';render();notify('GitHub 모의 저장소 생성 완료');break;
    case 'repo-add-menu':s.githubMenu=!s.githubMenu;render();break;
    case 'repo-code-menu':notify('Code 버튼에서는 HTTPS 주소를 복사할 수 있습니다. 이번 실습에서는 Add file 메뉴를 사용하세요.');break;
    case 'new-file':s.githubMenu=false;s.fileName='index.html';s.editorCode='';s.repoScreen='editor';render();break;
    case 'edit-file':s.fileName='index.html';s.editorCode=s.committedCode;s.repoScreen='editor';render();break;
    case 'paste-code':if(!s.clip){notify('ChatGPT에서 코드를 먼저 복사하세요.');return;}s.editorCode=s.clip;render();notify('가상 클립보드에서 코드를 붙여넣었습니다.');break;
    case 'cancel-editor':s.repoScreen='repo';render();break;
    case 'open-commit':if(s.fileName!=='index.html'){notify('파일 이름을 index.html로 지정하세요.');return;}if(!s.editorCode.trim()||!/<html[\s>]/i.test(s.editorCode)||!/<body[\s>]/i.test(s.editorCode)){notify('유효한 HTML 코드를 붙여넣어 주세요.');return;}s.modal='commit';render();break;
    case 'modal-close':s.modal='';render();break;
    case 'save-commit':if(!s.commitMessage.trim()){notify('커밋 메시지를 입력하세요.');return;}s.modal='';s.committedCode=s.editorCode;s.commitCount++;s.repoScreen='repo';if(s.deployed){s.deployed=false;s.deployedCode='';s.vercelScreen='dashboard'}render();notify('Commit changes 완료!');break;
    case 'next-vercel':if(!s.commitCount){notify('GitHub에 코드를 커밋한 뒤 이동하세요.');return;}s.stage='vercel';s.vercelScreen=s.vercelLoggedIn?'dashboard':'landing';render();break;
    case 'vercel-login':s.vercelScreen='login';render();break;
    case 'vercel-github-login':if(!s.githubLoggedIn){s.modal='oauth';s.modalReturn='login';render();return;}s.modal='oauth';render();break;
    case 'oauth-allow':s.githubAuthorized=true;s.modal='install';render();break;
    case 'app-install':s.githubAppInstalled=true;s.githubAuthorized=true;s.vercelLoggedIn=true;s.modal='';s.vercelScreen='dashboard';render();notify('GitHub ↔ Vercel 연결 승인 완료');break;
    case 'reconnect-github':s.modal='install';render();break;
    case 'vercel-project-menu':s.vercelMenu=!s.vercelMenu;render();break;
    case 'vercel-new':if(!s.vercelLoggedIn){s.vercelScreen='login';render();return;}s.modal='';s.vercelMenu=false;s.vercelScreen='import';render();break;
    case 'vercel-import':if(!s.committedCode){notify('GitHub에 커밋된 index.html이 필요합니다.');return;}if(!s.githubAppInstalled){s.modal='install';render();return;}s.selectedRepo=true;s.projectName=s.projectName||slug(s.repoName);s.vercelScreen='configure';render();break;
    case 'provider-unsupported':notify('이 교육용 과정에서는 GitHub 로그인으로 진행합니다.');break;
    case 'deploy':if(!s.projectName.trim()){notify('프로젝트 이름을 입력하세요.');return;}if(s.framework!=='Other'){notify('HTML 단일 파일은 Framework Preset을 Other로 선택하세요.');return;}if(!s.githubAppInstalled||!s.committedCode){notify('GitHub 권한과 커밋된 파일을 확인하세요.');return;}s.vercelScreen='deploying';s.deployLogStep=0;render();break;
    case 'visit':if(!s.deployed){notify('배포를 완료한 뒤 방문하세요.');return;}s.stage='result';render();break;
    case 'edit-again':s.stage='github';s.repoScreen='repo';render();notify('GitHub에서 파일을 수정하고 커밋해 다시 배포할 수 있습니다.');break;
    case 'guide-on':s.guide=true;s.hint=false;render();break;
    case 'guide-off':s.guide=false;s.hint=false;render();break;
    case 'hint-toggle':s.hint=!s.hint;render();break;
    case 'browser-refresh':render();notify('모의 화면 새로고침');break;
    case 'browser-back':if(s.modal){s.modal='';render();return;}if(s.stage==='github'){s.repoScreen=s.repoScreen==='dashboard'?'landing':s.repoScreen==='new-repo'?'dashboard':s.repoScreen==='editor'?'repo':'landing';render()}else if(s.stage==='vercel'){s.vercelScreen=s.vercelScreen==='import'?'dashboard':s.vercelScreen==='configure'?'import':'landing';render()}else {notify('화면 위쪽의 단계 버튼을 이용하세요.')}break;
    case 'restart':if(!window.confirm('실습 진행 상황을 모두 초기화할까요?'))return;clearInterval(deployTimer);deployTimer=null;s=defaults();render();notify('새 실습을 시작했습니다.');break;
  }}

  function startDeploy(){const steps=[0,1,2,3,4];let x=s.deployLogStep;deployTimer=setInterval(()=>{if(s.stage!=='vercel'||s.vercelScreen!=='deploying'){clearInterval(deployTimer);deployTimer=null;return;}x++;s.deployLogStep=x;if(x>=steps.length-1){clearInterval(deployTimer);deployTimer=null;s.deployed=true;s.deployedCode=s.committedCode;s.vercelScreen='success';render();notify('모의 배포가 완료되었습니다!')}else render()},880)}
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&s.modal){s.modal='';render()}});
  document.addEventListener('click',e=>{const goBtn=e.target.closest('[data-go]');if(goBtn){go(goBtn.dataset.go);return}const btn=e.target.closest('[data-action]');if(btn)handle(btn.dataset.action)});
  render();
})();
</script>
