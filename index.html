<body>
<div id="app"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
  const STORAGE='deploy-simulator-v1';
  const defaults=()=>({stage:'chat',chatScreen:'input',prompt:'',kind:'',code:'',clip:'',repoScreen:'dashboard',repoName:'',visibility:'public',repoCreated:false,fileName:'index.html',editorCode:'',committedCode:'',commitMessage:'Add index.html',commitCount:0,vercelScreen:'dashboard',projectName:'',selectedRepo:false,framework:'Other',deployed:false,deployedCode:'',guide:true,hint:false,deployLogStep:0});
  let s;try{s={...defaults(),...JSON.parse(localStorage.getItem(STORAGE)||'{}')}}catch(e){s=defaults()}
  let deployTimer=null;
  const $=q=>document.querySelector(q);
  const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const cleanTitle=t=>String(t||'나의 첫 홈페이지').replace(/[<>"'&]/g,'').trim().slice(0,54)||'나의 첫 홈페이지';
  const slug=t=>(String(t||'my-first-site').toLowerCase().replace(/[^a-z0-9-]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'').slice(0,44)||'my-first-site');
  function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(s))}catch(e){/* Storage may be blocked in file previews or private contexts; app remains usable. */}}
  function notify(t){const el=$('#toast');el.textContent=t;el.classList.add('visible');clearTimeout(notify.tm);notify.tm=setTimeout(()=>el.classList.remove('visible'),3100)}
  function determineKind(p){if(/학급|우리\s*반|학교|수업|교실|선생님|교사/.test(p))return 'classroom';if(/포트폴리오|작품|경력|프로젝트/.test(p))return 'portfolio';return 'personal'}
  function template(kind,p){let title,sub,items,color;
    if(kind==='classroom'){title='우리 반 이야기';sub='함께 배우고, 서로 성장하는 즐거운 교실';items=[['오늘의 소식','이번 주 학급 소식을 확인해요.'],['우리의 활동','친구들과 함께한 멋진 순간들'],['배움의 기록','하루하루 쌓이는 성장 이야기']];color='#2e6eac'}
    else if(kind==='portfolio'){title='나의 프로젝트';sub='아이디어를 작품으로 만드는 작은 기록';items=[['프로젝트 01','나만의 웹사이트 만들기'],['프로젝트 02','새로운 아이디어 구상하기'],['프로젝트 03','함께 배우고 나누기']];color='#7554b8'}
    else{title='안녕하세요!';sub='나의 첫 홈페이지에 오신 것을 환영합니다';items=[['나를 소개해요','새로운 것을 배우는 것을 좋아해요.'],['내가 좋아하는 것','다양한 취미와 관심사를 담았어요.'],['연락하기','방문해 주셔서 감사합니다!']];color='#188c87'}
    const cards=items.map(x=>`    <article class="card"><h2>${x[0]}</h2><p>${x[1]}</p></article>`).join('\n');
    return `<!DOCTYPE html>\n<html lang="ko">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1">\n  <title>${title}</title>\n  <style>\n    * { box-sizing: border-box; }\n    body { margin: 0; color: #193042; font-family: sans-serif; background: #f5f8fc; }\n    header { padding: 65px 20px; text-align: center; background: ${color}; color: white; }\n    h1 { margin: 0; font-size: 34px; }\n    header p { opacity: .93; }\n    main { max-width: 900px; margin: 25px auto; padding: 0 20px; display: grid; gap: 16px; }\n    .card { background: white; border-radius: 12px; padding: 22px; box-shadow: 0 2px 12px #17284014; }\n    h2 { font-size: 19px; margin: 0 0 8px; }\n    .card p { margin: 0; color: #66768a; }\n    footer { text-align: center; color: #8995a5; padding: 26px; }\n  </style>\n</head>\n<body>\n  <header><h1>${title}</h1><p>${sub}</p></header>\n  <main>\n${cards}\n  </main>\n  <footer>나의 첫 웹사이트 · 실습 예제</footer>\n</body>\n</html>`
  }
  function stageIndex(){return s.stage==='chat'?0:s.stage==='github'?1:s.stage==='vercel'?2:3}
  function canGo(stage){if(stage==='chat')return true;if(stage==='github')return !!s.code;if(stage==='vercel')return !!s.repoCreated;if(stage==='result')return !!s.deployed;return false}
  function go(stage){if(!canGo(stage)){notify('먼저 이전 단계를 완료해주세요.');return}s.stage=stage;render()}
  function steps(){let idx=stageIndex();return ['ChatGPT','GitHub','Vercel'].map((t,i)=>`<button class="step-pill ${i===idx?'active':i<idx?'done':''}" data-go="${['chat','github','vercel'][i]}"><b>${i<idx?'✓':i+1}</b>${t}</button>`).join('')}
  function address(){return s.stage==='chat'?'chatgpt.com':s.stage==='github'?'github.com':s.stage==='vercel'?'vercel.com':`https://${slug(s.projectName)}.vercel.app`}
  const svgGithub=`<svg viewBox="0 0 24 24" width="23" height="23" fill="currentColor" aria-hidden="true"><path d="M12 .75a11.25 11.25 0 0 0-3.56 21.92c.56.1.77-.24.77-.54v-1.9c-3.14.68-3.8-1.33-3.8-1.33-.51-1.3-1.25-1.65-1.25-1.65-1.03-.7.08-.69.08-.69 1.13.08 1.73 1.16 1.73 1.16 1 .17 1.6-.41 1.98-.78.1-.73.39-1.22.71-1.5-2.5-.28-5.12-1.25-5.12-5.56 0-1.22.44-2.22 1.16-3.01-.12-.29-.5-1.43.11-2.98 0 0 .95-.31 3.1 1.15a10.75 10.75 0 0 1 5.65 0c2.15-1.46 3.1-1.15 3.1-1.15.61 1.55.23 2.69.11 2.98a4.32 4.32 0 0 1 1.15 3.01c0 4.32-2.62 5.28-5.13 5.55.4.35.76 1.03.76 2.09v3.1c0 .3.2.65.78.54A11.25 11.25 0 0 0 12 .75Z"/></svg>`;
  function browser(){return `<section class="sim-window"><div class="browser-chrome"><div class="traffic"><span></span><span></span><span></span></div><div class="addressbar"><span class="lock">◆</span><span>${esc(address())}</span><span style="margin-left:auto;font-size:10px;color:#8794a6">모의 화면</span></div></div><div class="app-surface">${s.stage==='chat'?chat():s.stage==='github'?github():s.stage==='vercel'?vercel():result()}</div></section>`}
  function chat(){const isResp=s.chatScreen==='response';return `<div class="chat"><aside class="chat-side"><div class="chat-logo"><span style="font-size:22px">✺</span> ChatGPT</div><div class="nav active">✎ &nbsp; 새 채팅</div><div class="nav">⌕ &nbsp; 채팅 검색</div><div class="nav">◧ &nbsp; 라이브러리</div><div style="margin-top:18px;color:#858585;font-size:11px;padding-left:10px">내 채팅</div><div class="nav active">나만의 홈페이지 만들기</div></aside><div class="chat-main"><div class="chat-top"><span>ChatGPT ⌄</span><span style="color:#9e9e9e;font-size:12px">공유 ↗</span></div><div class="chat-content">${!isResp?`<div class="chat-welcome">무엇을 도와드릴까요?</div>`:`<div class="chat-prompt">${esc(s.prompt)}</div><div class="chat-reply"><h4>홈페이지 코드를 만들었어요!</h4><p>아래 코드를 복사해 GitHub 저장소의 <strong>index.html</strong> 파일에 붙여넣으세요.</p><div class="codeblock"><div class="codebar"><span>index.html</span><button data-action="copy-code" ${s.guide?'class="focus-target"':''}>▢ &nbsp;코드 복사</button></div><pre class="code">${esc(s.code)}</pre></div><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="secondary small" data-action="show-code-preview">미리보기</button><button class="primary small" data-action="next-github">GitHub로 이동 →</button></div></div>`}</div><div class="chat-bottom"><form id="prompt-form" class="chat-compose"><textarea id="prompt-input" placeholder="만들고 싶은 홈페이지를 설명하세요" aria-label="프롬프트 입력" rows="2">${esc(s.prompt)}</textarea><button class="send ${!isResp&&s.guide?'focus-target':''}" type="submit" aria-label="프롬프트 보내기">↑</button></form><div class="chat-note">실제 ChatGPT에 연결되지 않는 교육용 모의 대화입니다.</div></div></div></div>`}
  function githubTop(){return `<div class="g-top"><div class="g-mark">${svgGithub}</div><div class="g-search">⌕ &nbsp;Search or jump to...</div><div style="margin-left:auto;display:flex;align-items:center;gap:14px;color:#59636e;font-size:12px">Pull requests　Issues　 ◯</div></div>`}
  function github(){let b='';
    if(s.repoScreen==='dashboard')b=`<div class="g-body"><div style="display:flex;align-items:center;justify-content:space-between;gap:15px"><div><div class="g-title">Home</div><div class="g-muted">나의 GitHub 대시보드 (가상 계정)</div></div><button class="g-btn green ${s.guide?'focus-target':''}" data-action="github-new">＋ New repository</button></div><hr class="g-hr"><div style="font-weight:700;margin:17px 0 10px">Top repositories</div><div class="g-list"><div class="g-file-row"><span>▣</span> 아직 생성한 저장소가 없습니다.</div></div><div class="callout">ChatGPT에서 복사한 코드를 저장하기 위해 먼저 저장소(Repository)를 만들어야 합니다.</div></div>`;
    else if(s.repoScreen==='new-repo')b=`<div class="g-body"><div class="g-title">Create a new repository</div><div class="g-muted">A repository contains all of your project's files and revision history.</div><hr class="g-hr"><div class="g-form-field"><label>Repository name <span style="color:#cf222e">*</span></label><input class="input" id="repo-name" placeholder="my-first-website" value="${esc(s.repoName)}" autocomplete="off"><div class="sub">영문 소문자, 숫자, 하이픈으로 이름을 적어보세요.</div></div><div class="g-form-field"><label>Description <span style="color:#8993a1;font-weight:400">(optional)</span></label><input class="input" value="My first website" disabled></div><div class="g-form-field"><div class="g-radio"><input type="radio" name="visibility" value="public" ${s.visibility==='public'?'checked':''}><div><strong>Public</strong><div class="sub">Anyone on the internet can see this repository.</div></div></div><div class="g-radio"><input type="radio" name="visibility" value="private" ${s.visibility==='private'?'checked':''}><div><strong>Private</strong><div class="sub">You choose who can see this repository.</div></div></div></div><hr class="g-hr"><button data-action="create-repo" class="g-btn green ${s.guide?'focus-target':''}">Create repository</button></div>`;
    else if(s.repoScreen==='repo')b=`<div class="g-body"><div style="display:flex;align-items:center;gap:9px;font-size:13px;color:#59636e"><span>${svgGithub}</span> demo-user <span>/</span> <span class="g-repo-title">${esc(s.repoName)}</span> <span style="border:1px solid #d5dce3;border-radius:30px;padding:1px 8px;font-size:10px">${s.visibility==='public'?'Public':'Private'}</span></div><div class="g-nav-tabs"><span class="current">⌘ Code</span><span>◉ Issues</span><span>⇄ Pull requests</span><span>⚙ Settings</span></div><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px"><span class="g-muted">main ▾ &nbsp; ${s.commitCount} commit${s.commitCount===1?'':'s'}</span><button class="g-btn ${s.guide?'focus-target':''}" data-action="new-file">Add file ▾</button></div><div class="g-list"><div class="g-file-row">📁 &nbsp; ${s.commitCount?'Latest commit: '+esc(s.commitMessage):'Get started by creating a new file'}</div>${s.commitCount?`<div class="g-file-row"><span>📄</span><span class="filename">index.html</span><span style="margin-left:auto;color:#707b87">${esc(s.commitMessage)}</span><button class="g-btn small" data-action="edit-file">Edit</button></div>`:`<div class="g-file-row empty">This repository is empty. Use “Add file” to create your first file.</div>`}</div>${s.commitCount?`<div class="callout">파일 저장 완료! 이제 Vercel에서 이 저장소를 연결할 수 있습니다.</div><button class="primary" data-action="next-vercel">Vercel로 이동 →</button>`:''}</div>`;
    else if(s.repoScreen==='editor')b=`<div class="g-body"><div class="g-muted">demo-user / <strong>${esc(s.repoName)}</strong> / Creating a new file</div><div style="display:flex;gap:10px;align-items:center;margin-top:16px"><span style="font-size:14px">main /</span><input id="file-name" class="input" style="max-width:260px" value="${esc(s.fileName)}" aria-label="파일 이름"></div><div class="g-code-title"><span>⌘</span><strong style="font-size:12px">Edit new file</strong><button style="margin-left:auto" class="g-btn" data-action="paste-code">📋 코드 붙여넣기</button></div><textarea id="code-editor" class="g-codeeditor code" spellcheck="false" placeholder="ChatGPT에서 복사한 HTML 코드를 이곳에 붙여넣으세요.">${esc(s.editorCode)}</textarea><div class="g-notice">💡 파일 이름은 <strong>index.html</strong>로 입력하세요. 붙여넣기 버튼을 사용하거나 Ctrl+V로 붙여넣어도 됩니다.</div><div style="display:flex;justify-content:flex-end;gap:9px;margin-top:17px"><button class="g-btn" data-action="cancel-editor">Cancel changes</button><button class="g-btn green ${s.guide?'focus-target':''}" data-action="open-commit">Commit changes...</button></div></div>`;
    else if(s.repoScreen==='commit')b=`<div class="g-body"><div class="g-title">Commit changes</div><div class="g-muted">변경 사항을 저장소 기록에 남기는 단계입니다.</div><hr class="g-hr"><div class="g-form-field"><label>Commit message</label><input id="commit-message" class="input" value="${esc(s.commitMessage)}"></div><div class="g-form-field"><label>Commit directly to the main branch</label><div class="g-muted">파일을 저장하면 저장소의 내용이 실제로 변경된 것처럼 반영됩니다.</div></div><div style="margin-top:20px;display:flex;gap:8px"><button class="g-btn green ${s.guide?'focus-target':''}" data-action="save-commit">Commit changes</button><button class="g-btn" data-action="back-editor">Cancel</button></div></div>`;
    return `<div class="g-ui">${githubTop()}${b}</div>`}
  function vercelTop(){return `<div class="v-top"><div class="v-brand"><span class="v-triangle"></span> vercel <span style="color:#777;font-size:13px">/ &nbsp;demo-user</span></div><span class="v-muted">Overview　Settings　☻</span></div>`}
  function vercel(){let b='';
    if(s.vercelScreen==='dashboard')b=`<div class="v-body"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div><h2 class="v-heading">Overview</h2><div class="v-muted">My Projects</div></div><button data-action="vercel-new" class="v-btn white ${s.guide?'focus-target':''}">＋ Add New...</button></div><div class="v-card" style="text-align:center;padding:55px 18px"><div style="font-size:25px;margin-bottom:12px">▲</div><h3>No projects yet</h3><p class="v-muted">Import your first project from a Git repository.</p><button data-action="vercel-new" class="v-btn" style="margin-top:8px">New Project</button></div></div>`;
    else if(s.vercelScreen==='import')b=`<div class="v-body"><h2 class="v-heading">New Project</h2><p class="v-muted">Import a Git Repository</p><div class="v-card"><div style="display:flex;align-items:center;gap:10px;font-weight:700">${svgGithub} &nbsp; Import Git Repository</div><div class="v-repo"><div style="min-width:0"><div style="font-weight:700;font-size:13px">demo-user / ${esc(s.repoName)}</div><div class="v-muted">${s.commitCount?'main · index.html':'No commits found'}</div></div><button data-action="vercel-import" class="v-btn white ${s.guide?'focus-target':''}">Import</button></div></div><p class="v-muted" style="margin-top:15px">이 목록은 실제 GitHub에 연결되지 않습니다. 이전 단계에서 만든 가상 저장소입니다.</p></div>`;
    else if(s.vercelScreen==='configure')b=`<div class="v-body"><div class="v-muted">← New Project</div><h2 class="v-heading" style="margin-top:12px">Configure Project</h2><p class="v-muted">Deploy ${esc(s.repoName)} to Vercel</p><div class="v-card"><label class="v-label">Project Name</label><input id="project-name" class="v-input" value="${esc(s.projectName)}"><label class="v-label">Framework Preset</label><select id="framework" class="v-select"><option ${s.framework==='Other'?'selected':''}>Other</option><option ${s.framework==='Next.js'?'selected':''}>Next.js</option><option ${s.framework==='Vite'?'selected':''}>Vite</option></select><label class="v-label">Root Directory</label><input class="v-input" value="./" disabled><div style="border-top:1px solid #262626;margin-top:22px;padding-top:22px;display:flex;align-items:center;justify-content:space-between;gap:12px"><div class="v-muted">HTML 단일 파일 프로젝트는 Other를 선택하세요.</div><button data-action="deploy" class="v-btn white ${s.guide?'focus-target':''}">Deploy →</button></div></div></div>`;
    else if(s.vercelScreen==='deploying'){
      const logs=['Cloning repository: demo-user / '+s.repoName,'Inspecting source: index.html','Preparing static deployment','Uploading generated assets','Deployment ready'];
      b=`<div class="v-body"><h2 class="v-heading">Deploying ${esc(s.projectName)}</h2><p class="v-muted">모의 배포 로그가 진행 중입니다.</p><div class="v-card"><h3 style="margin:0 0 12px">Build Logs</h3><div class="v-logs code">${logs.slice(0,s.deployLogStep+1).map((l,i)=>`<div class="${i===s.deployLogStep&&s.deployLogStep<4?'run':'ok'}">${i===s.deployLogStep&&s.deployLogStep<4?'◌':'✓'} &nbsp;${esc(l)}</div>`).join('')}</div><div style="display:flex;align-items:center;gap:10px;margin-top:16px"><span style="height:8px;width:8px;border-radius:50%;background:#e4b85d"></span><span class="v-muted">Building...</span></div></div></div>`;
    }
    else if(s.vercelScreen==='success')b=`<div class="v-body"><div class="success-card"><div class="success-icon">✓</div><div class="success-title">Congratulations!</div><div style="color:#c1cfc7;font-size:13px">Your project has been deployed. (시뮬레이션)</div><p class="fakeurl">https://${esc(slug(s.projectName))}.vercel.app</p><button class="v-btn white" data-action="visit">Visit ↗</button><button class="v-btn" style="margin-left:8px" data-action="edit-again">GitHub에서 수정</button></div><div class="v-muted" style="text-align:center">위 주소는 학습용 가상 주소이며 실제 인터넷에 배포된 것은 아닙니다.</div></div>`;
    return `<div class="v-ui">${vercelTop()}${b}</div>`}
  function result(){return `<div class="preview-outer"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><div style="font-size:10px;color:#198b65;font-weight:800;letter-spacing:1px">SIMULATED DEPLOYMENT COMPLETE</div><h2 style="margin:2px 0 0;font-size:24px">나의 첫 웹사이트 완성!</h2></div><button class="secondary small" data-action="edit-again">↻ 코드 수정하고 재배포</button></div><div class="callout">이 페이지는 Vercel에 실제 게시된 것이 아닌 <strong>시뮬레이터 내부 미리보기</strong>입니다. 아래 결과물은 GitHub에서 커밋한 코드로 렌더링했습니다.</div><div class="preview-frame"><div class="preview-head"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span style="margin-left:12px">https://${esc(slug(s.projectName))}.vercel.app (가상 주소)</span></div><iframe title="배포된 홈페이지 모의 미리보기" sandbox="" srcdoc="${esc(s.deployedCode)}"></iframe></div><div style="margin-top:15px;display:flex;flex-wrap:wrap;gap:10px"><button class="primary" data-action="restart">새로운 배포 실습 시작</button><button class="secondary" data-go="vercel">Vercel 화면으로 돌아가기</button></div></div>`}
  function detail(){
    if(s.stage==='chat')return s.chatScreen==='response'?{title:'생성된 코드 복사하기',desc:'코드 블록의 ‘코드 복사’를 눌러 GitHub에 전달할 준비를 하세요.',hint:'복사한 코드는 다음 단계의 가상 클립보드에 보관됩니다.'}:{title:'홈페이지 제작 요청하기',desc:'입력창에 만들고 싶은 홈페이지를 설명한 뒤 전송 버튼을 누르세요.',hint:'예: 우리 반을 소개하는 홈페이지를 만들어줘.'};
    if(s.stage==='github')return ({dashboard:{title:'새 저장소 시작하기',desc:'New repository를 눌러 코드를 보관할 공간을 만드세요.',hint:'GitHub에서 Repository는 프로젝트의 파일과 변경 기록을 저장하는 곳입니다.'},'new-repo':{title:'저장소 이름 정하기',desc:'Repository name을 입력하고 Create repository를 클릭하세요.',hint:'예: my-first-website. 실제 GitHub에는 연결되지 않습니다.'},repo:{title:s.commitCount?'파일 저장 완료':'새 파일 만들기',desc:s.commitCount?'GitHub에서 파일이 커밋되었습니다. Vercel 단계로 넘어가세요.':'Add file 버튼을 눌러 index.html을 만드세요.',hint:'커밋이란 파일의 변경 내역을 저장소 기록으로 남기는 행동입니다.'},editor:{title:'코드 붙여넣기',desc:'index.html 파일에 ChatGPT에서 복사한 코드를 붙여넣고 Commit changes를 누르세요.',hint:'실제 붙여넣기도 가능하며 ‘코드 붙여넣기’ 버튼으로 가상 클립보드를 사용할 수 있습니다.'},commit:{title:'변경 사항 커밋하기',desc:'커밋 메시지를 확인하고 Commit changes를 클릭하세요.',hint:'commit message는 어떤 변경을 했는지 짧게 설명하는 기록입니다.'}})[s.repoScreen];
    if(s.stage==='vercel')return ({dashboard:{title:'새 프로젝트 만들기',desc:'Add New... 버튼으로 프로젝트 생성을 시작하세요.',hint:'Vercel은 GitHub에 저장된 프로젝트를 웹사이트로 배포하는 서비스입니다.'},import:{title:'GitHub 저장소 연결하기',desc:'앞에서 만든 저장소를 선택해 Import를 클릭하세요.',hint:'가상 GitHub 저장소만 표시됩니다.'},configure:{title:'배포 설정 확인하기',desc:'Project Name을 입력하고 Framework Preset을 Other로 설정한 뒤 Deploy를 누르세요.',hint:'index.html 단일 정적 사이트는 별도의 빌드 명령이 필요하지 않습니다.'},deploying:{title:'배포 진행 확인하기',desc:'배포 로그가 진행 중입니다. 각 단계를 읽어보세요.',hint:'로그는 교육용으로 구성된 가상 내용입니다.'},success:{title:'배포 결과 확인하기',desc:'Visit 버튼을 눌러 완성된 홈페이지의 모의 주소를 확인하세요.',hint:'실제 웹 주소나 외부 서비스 배포는 생성되지 않습니다.'}})[s.vercelScreen];
    return {title:'축하합니다! 모든 단계 완료',desc:'프롬프트 입력부터 코드 저장, 배포까지 전 과정을 완료했습니다.',hint:'GitHub에서 코드를 수정해 다시 배포하는 연습도 할 수 있습니다.'};
  }
  function progress(){let n=0;if(s.code)n+=20;if(s.repoCreated)n+=20;if(s.commitCount)n+=30;if(s.deployed)n+=20;if(s.stage==='result')n+=10;return n}
  function aside(){const d=detail();return `<aside class="sidebar"><section class="panel"><div class="overline">YOUR PROGRESS</div><div class="panel-row" style="margin-top:8px"><strong style="font-size:17px">배포까지 ${progress()}%</strong><span class="textmuted">${stageIndex()+1} / 4 단계</span></div><div class="progress-track"><div class="progress-fill" style="width:${progress()}%"></div></div><div class="mini-check ${s.code?'complete':''}"><b>${s.code?'✓':'1'}</b> ChatGPT 코드 생성</div><div class="mini-check ${s.repoCreated?'complete':''}"><b>${s.repoCreated?'✓':'2'}</b> GitHub 저장소 생성</div><div class="mini-check ${s.commitCount?'complete':''}"><b>${s.commitCount?'✓':'3'}</b> 코드 커밋</div><div class="mini-check ${s.deployed?'complete':''}"><b>${s.deployed?'✓':'4'}</b> Vercel 배포</div></section><section class="panel"><div class="overline">CURRENT MISSION</div><h3>${esc(d.title)}</h3><p>${esc(d.desc)}</p><div class="toggle-row"><button class="${s.guide?'selected':''}" data-action="guide-on">안내 모드</button><button class="${!s.guide?'selected':''}" data-action="guide-off">도전 모드</button></div>${s.guide?`<div class="hint-box">💡 ${esc(d.hint)}</div>`:`<button class="hint-btn" data-action="hint-toggle">${s.hint?'힌트 접기':'힌트 보기'}</button>${s.hint?`<div class="hint-box">${esc(d.hint)}</div>`:''}`}</section><section class="panel"><div class="overline">SIMULATION DATA</div><p style="margin:10px 0 5px">프로젝트: <strong>${esc(s.repoName||'생성 전')}</strong></p><p style="margin:5px 0">코드: <strong>${s.code?'생성됨':'없음'}</strong></p><p style="margin:5px 0">커밋: <strong>${s.commitCount}회</strong></p><p style="margin:5px 0">배포: <strong>${s.deployed?'성공':'미완료'}</strong></p><hr class="g-hr"><div class="legal">⚑ 본 사이트는 독립적인 비공식 교육용 시뮬레이터입니다. ChatGPT, GitHub, Vercel과 제휴하거나 연결되어 있지 않습니다.</div></section></aside>`}
  function render(){persist();const root=$('#app');root.innerHTML=`<header class="app-header"><div class="brand"><div class="brand-emblem">↗</div><div><div class="brand-title">배포 연습실 <span style="font-size:12px;color:#99aece;font-weight:400">SHIPLAB</span></div><div class="brand-sub">ChatGPT → GitHub → Vercel 실습 시뮬레이터</div></div></div><div class="header-right"><span class="chip">● &nbsp;가상 실습 환경</span><button class="reset" data-action="restart">↺ 처음부터</button></div></header><main class="shell"><div class="intro"><div><h1>웹앱 배포, 직접 해보며 배우기</h1><p>실제 서비스와 유사한 화면에서 입력 · 저장 · 배포를 체험해 보세요.</p></div><nav class="stepper" aria-label="실습 단계">${steps()}</nav></div><div class="workspace">${browser()}${aside()}</div></main>`;bindText();if(s.stage==='vercel'&&s.vercelScreen==='deploying'&&!deployTimer)startDeploy()}
  function bindText(){const bindings=[['prompt-input','prompt'],['repo-name','repoName'],['file-name','fileName'],['code-editor','editorCode'],['commit-message','commitMessage'],['project-name','projectName']];bindings.forEach(([id,key])=>{const el=$(`#${id}`);if(el)el.addEventListener('input',()=>{s[key]=el.value;persist()})});const f=$('#prompt-form');if(f)f.addEventListener('submit',e=>{e.preventDefault();if(!s.prompt.trim()){notify('먼저 만들고 싶은 홈페이지를 입력해주세요.');return;}s.kind=determineKind(s.prompt);s.code=template(s.kind,s.prompt);s.chatScreen='response';render();notify('홈페이지 코드가 생성되었습니다!')});document.querySelectorAll('input[name="visibility"]').forEach(el=>el.addEventListener('change',()=>{s.visibility=el.value;persist()}));const sel=$('#framework');if(sel)sel.addEventListener('change',()=>{s.framework=sel.value;persist()});const edt=$('#code-editor');if(edt)edt.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();const st=edt.selectionStart;edt.value=edt.value.slice(0,st)+'  '+edt.value.slice(edt.selectionEnd);edt.selectionStart=edt.selectionEnd=st+2;s.editorCode=edt.value;persist()}})}
  function showPreview(code){const blob=new Blob([code],{type:'text/html'});const url=URL.createObjectURL(blob);const w=window.open('about:blank','_blank');if(!w){notify('팝업 차단을 해제하거나 브라우저 설정을 확인해주세요.');URL.revokeObjectURL(url);return;}w.document.write(`<html lang="ko"><meta charset="utf-8"><title>모의 홈페이지 미리보기</title><style>body{margin:0;font-family:Arial,sans-serif}header{background:#151b25;color:#fff;padding:10px 15px;font-size:12px}iframe{width:100%;height:calc(100vh - 38px);border:0}</style><header>모의 홈페이지 미리보기 · 실제 배포 아님</header><iframe id="sample" sandbox=""></iframe></html>`);w.document.close();w.document.getElementById('sample').srcdoc=code;setTimeout(()=>URL.revokeObjectURL(url),1000)}
  function handle(action){switch(action){case 'copy-code':s.clip=s.code;persist();if(navigator.clipboard?.writeText)navigator.clipboard.writeText(s.code).catch(()=>{});notify('코드를 복사했습니다. GitHub에 붙여넣으세요.');break;
    case 'show-code-preview':showPreview(s.code);break;case 'next-github':s.stage='github';render();break;
    case 'github-new':s.repoScreen='new-repo';render();break;
    case 'create-repo':if(!/^[a-zA-Z0-9][a-zA-Z0-9._-]{1,79}$/.test(s.repoName)){notify('저장소 이름을 영문·숫자·하이픈 등으로 2~80자 입력해주세요.');return;}s.repoCreated=true;s.repoScreen='repo';render();notify('가상 저장소가 생성되었습니다.');break;
    case 'new-file':s.fileName='index.html';s.editorCode='';s.repoScreen='editor';render();break;
    case 'edit-file':s.fileName='index.html';s.editorCode=s.committedCode;s.repoScreen='editor';render();break;
    case 'paste-code':if(!s.clip){notify('ChatGPT에서 먼저 코드를 복사해주세요.');return;}s.editorCode=s.clip;render();notify('코드를 붙여넣었습니다.');break;
    case 'cancel-editor':s.repoScreen='repo';render();break;
    case 'open-commit':if(s.fileName!=='index.html'){notify('실습에서는 파일명을 index.html로 지정해주세요.');return;}if(!s.editorCode.trim()){notify('HTML 코드를 먼저 입력해주세요.');return;}if(!/<html[\s>]/i.test(s.editorCode)||!/<body[\s>]/i.test(s.editorCode)){notify('HTML 형식의 코드인지 확인해주세요.');return;}s.repoScreen='commit';render();break;
    case 'back-editor':s.repoScreen='editor';render();break;
    case 'save-commit':s.committedCode=s.editorCode;s.commitCount++;s.repoScreen='repo';if(s.deployed){s.deployed=false;s.deployedCode='';s.vercelScreen='dashboard'}render();notify('파일이 성공적으로 커밋되었습니다.');break;
    case 'next-vercel':s.stage='vercel';s.vercelScreen='dashboard';render();break;
    case 'vercel-new':s.vercelScreen='import';render();break;
    case 'vercel-import':if(!s.committedCode){notify('index.html 파일이 커밋되어 있어야 합니다.');return;}s.selectedRepo=true;s.projectName=s.projectName||slug(s.repoName);s.vercelScreen='configure';render();break;
    case 'deploy':if(!s.projectName.trim()){notify('프로젝트 이름을 입력해주세요.');return;}if(s.framework!=='Other'){notify('이번 HTML 단일 파일 실습에서는 Framework Preset을 Other로 선택해주세요.');return;}if(!s.committedCode){notify('GitHub에 커밋된 index.html이 없습니다.');return;}s.vercelScreen='deploying';s.deployLogStep=0;render();break;
    case 'visit':if(!s.deployed){notify('배포가 완료되지 않았습니다.');return;}s.stage='result';render();break;
    case 'edit-again':s.stage='github';s.repoScreen='repo';render();notify('기존 파일을 Edit로 수정해 새 커밋을 만들 수 있습니다.');break;
    case 'guide-on':s.guide=true;s.hint=false;render();break;
    case 'guide-off':s.guide=false;s.hint=false;render();break;
    case 'hint-toggle':s.hint=!s.hint;render();break;
    case 'restart':if(!window.confirm('진행 중인 실습을 모두 초기화하고 다시 시작할까요?'))return;clearInterval(deployTimer);deployTimer=null;s=defaults();render();notify('새 실습을 시작했습니다.');break;
  }}
  function startDeploy(){const steps=[0,1,2,3,4];let x=s.deployLogStep;deployTimer=setInterval(()=>{if(s.stage!=='vercel'||s.vercelScreen!=='deploying'){clearInterval(deployTimer);deployTimer=null;return;}x++;s.deployLogStep=x;if(x>=steps.length-1){clearInterval(deployTimer);deployTimer=null;s.deployed=true;s.deployedCode=s.committedCode;s.vercelScreen='success';render();notify('모의 배포가 완료되었습니다!')}else render()},880)}
  document.addEventListener('click',e=>{const goBtn=e.target.closest('[data-go]');if(goBtn){go(goBtn.dataset.go);return}const btn=e.target.closest('[data-action]');if(btn)handle(btn.dataset.action)});
  render();
})();
</script>
</body>
