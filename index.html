<script>
(()=>{
  const STORAGE='ship-lab-v3-ai-push';
  const defaults=()=>({stage:'chat',chatScreen:'input',prompt:'',kind:'',code:'',clip:'',agentConnected:false,agentLogStep:0,pushCount:0,repoScreen:'landing',githubLoggedIn:false,githubFileOpen:false,githubUser:'demo-student',githubMenu:false,githubAppInstalled:false,githubAuthorized:false,authScope:'selected',modal:'',modalReturn:'',vercelLoggedIn:false,vercelMenu:false,repoFilter:'',repoName:'my-first-website',visibility:'public',repoCreated:false,fileName:'index.html',editorCode:'',committedCode:'',commitMessage:'Add index.html',commitCount:0,vercelScreen:'landing',projectName:'',selectedRepo:false,framework:'Other',deployed:false,deployedCode:'',guide:true,hint:false,basicsOpen:false,everDeployed:false,deployLogStep:0,mode:'auto',modeSaves:{}});

  function determineKind(p){if(/학급|우리\s*반|학교|수업|교실|선생님|교사/.test(p))return 'classroom';if(/포트폴리오|작품|경력|프로젝트/.test(p))return 'portfolio';return 'personal'}
  function template(kind,p){let title,sub,items,color;
    if(kind==='classroom'){title='우리 반 이야기';sub='함께 배우고, 서로 성장하는 즐거운 교실';items=[['오늘의 소식','이번 주 학급 소식을 확인해요.'],['우리의 활동','친구들과 함께한 멋진 순간들'],['배움의 기록','하루하루 쌓이는 성장 이야기']];color='#2e6eac'}

  </style>\n</head>\n<body>\n  <header><h1>${title}</h1><p>${sub}</p></header>\n  <main>\n${cards}\n  </main>\n  <footer>나의 첫 웹사이트 · 실습 예제</footer>\n</body>\n</html>`

  function basics(){return `<section class="onboarding" aria-label="세 서비스의 역할"><div class="onboarding-top"><h2><span class="intro-strong">처음이라면 이것만 기억해요.</span> AI가 만들고, GitHub가 보관하고, Vercel이 공개해요.</h2><button data-action="toggle-basics" aria-expanded="${s.basicsOpen?'true':'false'}">${s.basicsOpen?'간단히 접기 −':'역할 다시 보기 +'}</button></div>${s.basicsOpen?`<div class="roles"><div class="role-box"><span class="role-index">✳</span><div><strong>${s.mode==='free'?'ChatGPT · 코드 생성':'AI 코딩 에이전트 · 제작자'}</strong><p>${s.mode==='free'?'말로 설명해 얻은 코드를 직접 복사해요.':'말로 설명하면 홈페이지 코드를 만들고 수정해요.'}</p></div></div><div class="role-box"><span class="role-index">⌁</span><div><strong>GitHub · 보관함</strong><p>${s.mode==='free'?'복사한 코드를 직접 등록하고 변경 기록을 남겨요.':'AI가 만든 코드를 저장하고 변경 기록을 남겨요.'}</p></div></div><div class="role-box"><span class="role-index">▲</span><div><strong>Vercel · 게시판</strong><p>GitHub 파일을 인터넷에서 열리는 사이트로 배포해요.</p></div></div></div>`:''}</section>`}

  function progress(){if(s.mode==='free'){let n=0;if(s.code)n+=20;if(s.clip)n+=13;if(s.githubLoggedIn)n+=10;if(s.repoCreated)n+=12;if(s.commitCount)n+=19;if(s.vercelLoggedIn)n+=10;if(s.githubAppInstalled)n+=8;if(s.deployed)n+=8;return Math.min(n,100)}let n=0;if(s.code)n+=20;if(s.githubLoggedIn)n+=12;if(s.agentConnected)n+=12;if(s.pushCount)n+=21;if(s.vercelLoggedIn)n+=9;if(s.githubAppInstalled)n+=9;if(s.deployed)n+=13;if(s.stage==='result')n+=4;return Math.min(n,100)}

  function updateCoach(){
    document.querySelectorAll('.context-coach').forEach(e=>e.remove());
    if(!s.guide)return;
    const surface=$('.sim-window'),target=surface?.querySelector('.popup-window .focus-target')||surface?.querySelector('.focus-target');if(!surface||!target)return;
    const word=detail()?.coach;if(!word)return;
    const cue=document.createElement('div');cue.className='context-coach';cue.innerHTML='<span class="coach-bulb">✦</span><span>'+esc(word)+'</span>';surface.appendChild(cue);
    const a=surface.getBoundingClientRect(),r=target.getBoundingClientRect();
    const w=Math.min(280,a.width-32);cue.style.maxWidth=w+'px';
    const desiredTop=r.bottom-a.top+13,aboveTop=r.top-a.top-cue.offsetHeight-13;
    cue.style.top=(desiredTop+cue.offsetHeight<a.height-8?desiredTop:Math.max(53,aboveTop))+'px';
    cue.style.left=Math.max(12,Math.min(r.left-a.left,w?a.width-cue.offsetWidth-12:0))+'px';
  }
  window.addEventListener('resize',()=>{if(s.guide)updateCoach()});
  function render(){persist();const root=$('#app');root.innerHTML=`<header class="app-header"><div class="brand"><div class="brand-emblem">↗</div><div><div class="brand-title">배포 연습실 <span style="font-size:12px;color:#99aece;font-weight:400">SHIPLAB</span></div><div class="brand-sub">AI 코딩 에이전트 → GitHub → Vercel 실습</div></div></div><div class="header-right"><span class="chip">● &nbsp;가상 실습 환경</span><button class="reset" data-action="restart">↺ 처음부터</button></div></header><main class="shell"><div class="intro"><div><h1>${s.mode==='free'?'무료 계정으로 웹앱 배포하기':'AI가 GitHub에 푸시하고, Vercel로 배포하기'}</h1><p>${s.mode==='free'?'AI에게 코드 요청 → 코드 복사 → GitHub에 직접 등록 → Vercel 배포':'AI에게 요청하면 코드를 만들고 GitHub에 푸시해요. GitHub 확인 뒤 Vercel로 배포합니다.'}</p></div><nav class="stepper" aria-label="실습 단계">${steps()}</nav></div><div class="path-tabs" role="tablist" aria-label="배포 실습 경로"><button type="button" class="path-tab ${s.mode==='auto'?'active':''}" role="tab" aria-selected="${s.mode==='auto'}" data-action="mode-auto"><span class="path-icon">✦</span><span class="path-copy"><strong>유료·자동화 버전 <em>기본</em></strong><small>AI가 GitHub에 자동 푸시하는 실습</small></span></button><button type="button" class="path-tab ${s.mode==='free'?'active':''}" role="tab" aria-selected="${s.mode==='free'}" data-action="mode-free"><span class="path-icon">↗</span><span class="path-copy"><strong>무료 버전</strong><small>코드 복사 → GitHub 직접 등록</small></span></button></div><div class="path-notice"><b>${s.mode==='free'?'💡 무료 계정으로 따라 하는 방법':'✨ AI 자동화 방식이 기본으로 열립니다.'}</b><span>${s.mode==='free'?'ChatGPT·GitHub·Vercel의 무료 기능을 활용하는 입문 경로예요. 코드를 직접 복사하고 커밋하는 과정을 배우며, 별도 유료 API는 사용하지 않습니다.':'자동 푸시를 지원하는 코딩 에이전트의 작업을 모의 체험합니다. 실제 사용 가능 여부와 요금은 선택한 도구·계정·이용 한도에 따라 달라질 수 있어요.'}</span></div>${basics()}<div class="workspace">${browser()}${aside()}</div></main>`;bindText();updateCoach();if(s.stage==='chat'&&s.chatScreen==='pushing'&&!agentTimer)startAgentPush();if(s.stage==='vercel'&&s.vercelScreen==='deploying'&&!deployTimer)startDeploy()}
  function showTransition(label,run,delay=1150){
    if(transitionTimer)return;

    transitionTimer=setTimeout(()=>{transitionTimer=null;run()},delay);

  function bindText(){
    const bindings=[['prompt-input','prompt'],['github-user','githubUser'],['repo-name','repoName'],['file-name','fileName'],['code-editor','editorCode'],['commit-message','commitMessage'],['project-name','projectName'],['repo-filter','repoFilter'],['agent-repo-name','repoName'],['agent-github-user','githubUser']];
    bindings.forEach(([id,key])=>{const el=$('#'+id);if(el)el.addEventListener('input',()=>{s[key]=el.value;persist();if(id==='repo-filter'){const at=el.selectionStart;render();const n=$('#repo-filter');if(n){n.focus();n.setSelectionRange(at,at)}}})});
    const f=$('#prompt-form');if(f)f.addEventListener('submit',e=>{e.preventDefault();if(!s.prompt.trim()){notify('만들고 싶은 홈페이지를 먼저 설명하세요.');return;}if(promptTimer)return;s.kind=determineKind(s.prompt);s.chatScreen='generating';s.code='';if(s.mode==='free')s.clip='';render();const submitted=s.prompt;promptTimer=setTimeout(()=>{promptTimer=null;if(s.chatScreen!=='generating'||s.prompt!==submitted)return;s.code=template(s.kind,s.prompt);s.chatScreen='response';render();notify('홈페이지 코드가 준비됐어요.')},1550)});
    document.querySelectorAll('input[name="visibility"]').forEach(el=>el.addEventListener('change',()=>{s.visibility=el.value;persist()}));
    document.querySelectorAll('input[name="agent-visibility"]').forEach(el=>el.addEventListener('change',()=>{s.visibility=el.value;persist()}));
    document.querySelectorAll('input[name="auth-scope"]').forEach(el=>el.addEventListener('change',()=>{s.authScope=el.value;render()}));
    const sel=$('#framework');if(sel)sel.addEventListener('change',()=>{s.framework=sel.value;persist()});
    const edt=$('#code-editor');if(edt)edt.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();const st=edt.selectionStart;edt.value=edt.value.slice(0,st)+'  '+edt.value.slice(edt.selectionEnd);edt.selectionStart=edt.selectionEnd=st+2;s.editorCode=edt.value;persist()}});

  function showPreview(code){const blob=new Blob([code],{type:'text/html'});const url=URL.createObjectURL(blob);const w=window.open('about:blank','_blank');if(!w){notify('팝업 차단을 해제하거나 브라우저 설정을 확인해주세요.');URL.revokeObjectURL(url);return;}w.document.write(`<html lang="ko"><meta charset="utf-8"><title>모의 홈페이지 미리보기</title><style>body{margin:0;font-family:Arial,sans-serif}header{background:#151b25;color:#fff;padding:10px 15px;font-size:12px}iframe{width:100%;height:calc(100vh - 38px);border:0}</style><header>모의 홈페이지 미리보기 · 실제 배포 아님</header><iframe id="sample" sandbox=""></iframe></html>`);w.document.close();w.document.getElementById('sample').srcdoc=code;setTimeout(()=>URL.revokeObjectURL(url),1000)}
  function handle(action){switch(action){
    case 'copy-code':s.clip=s.code;persist();if(navigator.clipboard?.writeText)navigator.clipboard.writeText(s.code).catch(()=>{});render();notify(s.mode==='free'?'코드 복사 완료! GitHub에서 index.html에 붙여넣어요.':'코드 복사 완료! 자동화 실습에서는 AI가 직접 푸시해요.');break;
    case 'show-code-preview':showPreview(s.code);break;
    case 'next-github':if(s.mode==='free'){if(!s.code){notify('ChatGPT에서 코드를 먼저 만들어 주세요.');return;}if(!s.clip){notify('코드를 복사하지 않았어요. 코드 복사 버튼을 먼저 눌러 주세요.');return;}s.stage='github';s.repoScreen=s.githubLoggedIn?(s.repoCreated?'repo':'dashboard'):'landing';render();break;}if(!s.pushCount){notify('먼저 AI가 GitHub로 푸시하도록 해 주세요.');return;}s.stage='github';s.repoScreen='repo';render();break;
    case 'connect-agent':if(!s.code){notify('프롬프트를 입력해 홈페이지를 먼저 만들어 주세요.');return;}s.modal=s.agentConnected?'agent-push':'agent-connect';render();break;
    case 'agent-continue':s.modal=s.githubLoggedIn?'agent-permissions':'agent-signin';render();break;
    case 'agent-signin':if(!/^[a-zA-Z0-9-]{2,35}$/.test(s.githubUser)){notify('영문 2자 이상의 체험 계정 이름을 입력해 주세요.');return;}s.githubLoggedIn=true;s.modal='agent-permissions';render();notify('GitHub 모의 로그인 완료');break;
    case 'agent-authorize':s.agentConnected=true;s.modal='agent-push';render();notify('GitHub 연결 권한을 모의 승인했습니다.');break;
    case 'agent-push':if(!s.agentConnected){notify('GitHub 연동을 먼저 승인해 주세요.');return;}if(!/^[a-zA-Z0-9][a-zA-Z0-9._-]{1,79}$/.test(s.repoName)){notify('저장소 이름을 영문 또는 숫자로 시작하는 2~80자로 입력해 주세요.');return;}s.repoCreated=true;s.committedCode=s.code;s.editorCode=s.code;s.fileName='index.html';s.commitMessage='Initial website created by AI';s.commitCount+=1;s.pushCount+=1;s.modal='';s.chatScreen='pushing';s.agentLogStep=0;s.deployed=false;s.deployedCode='';s.projectName=slug(s.repoName);render();notify('AI가 GitHub에 푸시하는 모의 작업을 시작합니다.');break;

    case 'github-show-readme':notify('README.md: My first website · built with AI');break;

    case 'github-signin':if(!/^[a-zA-Z0-9-]{2,35}$/.test(s.githubUser)){notify('체험용 사용자 이름을 영문 2~35자로 입력하세요.');return;}s.githubLoggedIn=true;s.repoScreen='dashboard';render();notify('GitHub 모의 로그인 완료');break;

    case 'modal-close':s.modal='';render();break;
    case 'save-commit':if(!s.commitMessage.trim()){notify('커밋 메시지를 입력하세요.');return;}s.modal='';s.committedCode=s.editorCode;s.commitCount++;s.repoScreen='repo';if(s.mode==='free'&&s.everDeployed){s.deployed=true;s.deployedCode=s.committedCode;s.vercelScreen='success'}else if(s.deployed){s.deployed=false;s.deployedCode='';s.vercelScreen='dashboard'}render();notify(s.mode==='free'&&s.everDeployed?'커밋 저장 완료! 연결된 Vercel 자동 재배포도 모의 완료했어요.':'Commit changes 완료!');break;
    case 'next-vercel':if(!s.commitCount){notify('GitHub에 코드를 커밋한 뒤 이동하세요.');return;}s.stage='vercel';s.vercelScreen=(s.everDeployed&&s.deployed)?'success':(s.vercelLoggedIn?'dashboard':'landing');render();break;
    case 'vercel-login':s.vercelScreen='login';render();break;
    case 'vercel-github-login':if(!s.githubLoggedIn){s.modal='oauth';s.modalReturn='login';render();return;}s.modal='oauth';render();break;
    case 'oauth-allow':s.githubAuthorized=true;s.modal='install';render();break;
    case 'app-install':s.githubAppInstalled=true;s.githubAuthorized=true;s.vercelLoggedIn=true;s.modal='';s.vercelScreen='dashboard';render();notify('GitHub ↔ Vercel 연결 승인 완료');break;
    case 'reconnect-github':s.modal='install';render();break;
    case 'vercel-project-menu':s.vercelMenu=!s.vercelMenu;render();break;
    case 'vercel-new':if(!s.vercelLoggedIn){s.vercelScreen='login';render();return;}s.modal='';s.vercelMenu=false;s.vercelScreen='import';render();break;
    case 'vercel-import':if(!s.committedCode){notify('GitHub에 커밋된 index.html이 필요합니다.');return;}if(!s.githubAppInstalled){s.modal='install';render();return;}s.selectedRepo=true;s.projectName=s.projectName||slug(s.repoName);s.vercelScreen='configure';render();break;
    case 'provider-unsupported':notify('이 교육용 과정에서는 GitHub 로그인으로 진행합니다.');break;
    case 'deploy':if(!s.projectName.trim()){notify('프로젝트 이름을 입력하세요.');return;}if(s.framework!=='Other'){notify('HTML 단일 파일은 Framework Preset을 Other로 선택하세요.');return;}if(!s.githubAppInstalled||!s.committedCode){notify('GitHub 권한과 커밋된 파일을 확인하세요.');return;}s.vercelScreen='deploying';s.deployLogStep=0;render();break;
    case 'visit':if(!s.deployed){notify('배포를 완료한 뒤 방문하세요.');return;}s.stage='result';render();break;
    case 'edit-again':s.stage='chat';s.chatScreen='response';s.deployed=false;s.deployedCode='';if(s.mode==='free')s.clip='';render();notify(s.mode==='free'?'AI에게 새 코드를 요청한 후, GitHub의 기존 파일을 수정해 커밋해 보세요.':'프롬프트를 수정하고 AI에 다시 푸시를 요청해 보세요.');break;
    case 'mode-auto':switchMode('auto');break;
    case 'mode-free':switchMode('free');break;
    case 'toggle-basics':s.basicsOpen=!s.basicsOpen;render();break;
    case 'guide-on':s.guide=true;s.hint=false;render();break;
    case 'guide-off':s.guide=false;s.hint=false;render();break;
    case 'hint-toggle':s.hint=!s.hint;render();break;
    case 'browser-refresh':render();notify('모의 화면 새로고침');break;
    case 'browser-back':if(s.modal){s.modal='';render();return;}if(s.stage==='github'){s.repoScreen=s.repoScreen==='dashboard'?'landing':s.repoScreen==='new-repo'?'dashboard':s.repoScreen==='editor'?'repo':'landing';render()}else if(s.stage==='vercel'){s.vercelScreen=s.vercelScreen==='import'?'dashboard':s.vercelScreen==='configure'?'import':'landing';render()}else {notify('화면 위쪽의 단계 버튼을 이용하세요.')}break;
    case 'restart':if(!window.confirm('현재 탭의 실습 진행 상황을 초기화할까요?'))return;clearInterval(deployTimer);deployTimer=null;clearInterval(agentTimer);agentTimer=null;clearTimeout(promptTimer);promptTimer=null;clearTimeout(transitionTimer);transitionTimer=null;const currentMode=s.mode;const modeSaves=s.modeSaves||{};delete modeSaves[currentMode];s={...defaults(),mode:currentMode,modeSaves};render();notify('현재 탭에서 새 실습을 시작했습니다.');break;
  }}

  function startAgentPush(){
    let x=s.agentLogStep;agentTimer=setInterval(()=>{
      if(s.stage!=='chat'||s.chatScreen!=='pushing'){clearInterval(agentTimer);agentTimer=null;return}
      x++;s.agentLogStep=x;
      if(x>=3){clearInterval(agentTimer);agentTimer=null;s.chatScreen='pushed';if(s.everDeployed){s.deployed=true;s.deployedCode=s.committedCode;s.vercelScreen='success';}render();notify(s.everDeployed?'GitHub 푸시 후 Vercel 자동 재배포가 완료됐어요!':'GitHub로 모의 푸시를 완료했어요!')}
      else render();
    },620)
  }
  function startDeploy(){const steps=[0,1,2,3,4];let x=s.deployLogStep;deployTimer=setInterval(()=>{if(s.stage!=='vercel'||s.vercelScreen!=='deploying'){clearInterval(deployTimer);deployTimer=null;return;}x++;s.deployLogStep=x;if(x>=steps.length-1){clearInterval(deployTimer);deployTimer=null;s.deployed=true;s.deployedCode=s.committedCode;s.everDeployed=true;s.vercelScreen='success';render();notify('모의 배포가 완료되었습니다!')}else render()},480)}
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&s.modal){s.modal='';render()}});
  document.addEventListener('click',e=>{
    if(transitionTimer)return;
    const goBtn=e.target.closest('[data-go]');
    if(goBtn){const dest=goBtn.dataset.go;if(dest!==s.stage&&canGo(dest)){showTransition(({'chat':'AI 작업 화면','github':'GitHub','vercel':'Vercel','result':'배포 결과'})[dest]+'(으)로 이동하고 있어요',()=>go(dest),1100)}else go(dest);return}
    const btn=e.target.closest('[data-action]');if(!btn)return;
    const action=btn.dataset.action;
    const waits={
      'next-github':['GitHub를 열고 있어요',1200], 'next-vercel':['Vercel을 열고 있어요',1200],
      'github-login':['GitHub 로그인 화면을 열고 있어요',1050], 'github-signin':['GitHub 계정에 로그인하고 있어요',1100],
      'github-signup-complete':['GitHub 계정을 준비하고 있어요',1100], 'github-new':['새 저장소 화면을 열고 있어요',980],
      'create-repo':['GitHub 저장소를 만들고 있어요',1200], 'new-file':['파일 편집 화면을 여는 중이에요',920],
      'save-commit':['변경 내용을 저장하고 있어요',1300], 'vercel-login':['Vercel 로그인 화면을 열고 있어요',1080],
      'vercel-github-login':['GitHub 연결을 준비하고 있어요',1100], 'app-install':['저장소 접근 권한을 연결하고 있어요',1150],
      'vercel-new':['새 프로젝트 화면을 열고 있어요',1050], 'vercel-import':['GitHub 저장소를 가져오고 있어요',1350],
      'visit':['완성된 홈페이지를 여는 중이에요',1200],
      'agent-signin':['GitHub 계정을 연결하고 있어요',1000], 'agent-authorize':['GitHub 권한을 확인하고 있어요',1100]
    };
    if(waits[action]){const [label,ms]=waits[action];showTransition(label,()=>handle(action),ms)}
    else handle(action);
  });
  render();
})();
</script>
